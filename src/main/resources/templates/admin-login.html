<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | M.J Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f9f5;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .login-card h1 {
            text-align: center;
            color: #084c37;
            margin-bottom: 8px;
        }

        .login-card p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5e2da;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0d6849;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6849;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #084c37;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>M.J Academy</h1>

    <p>Admin Login</p>

    <form action="/admin/login" method="post">

        <div class="form-group">
            <label for="username">Username</label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
