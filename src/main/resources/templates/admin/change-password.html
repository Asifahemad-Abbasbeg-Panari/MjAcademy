<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | M.J Academy</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        .password-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: #f7f3e9;
        }

        .password-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .password-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0b5d3b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .password-card h1 {
            text-align: center;
            color: #0b5d3b;
            margin-bottom: 10px;
        }

        .password-card > p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0b5d3b;
        }

        .change-password-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b5d3b;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .change-password-btn:hover {
            background: #08482e;
        }

        .back-dashboard {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #0b5d3b;
            text-decoration: none;
            font-weight: 600;
        }

        .back-dashboard:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .password-page {
                padding: 20px 15px;
            }

            .password-card {
                padding: 30px 20px;
            }

        }

    </style>
</head>

<body>

<div class="password-page">

    <div class="password-card">

        <div class="password-icon">
            🔐
        </div>

        <h1>Change Password</h1>

        <p>
            Update your administrator account password.

        </p>
        <div th:if="${error}"
             style="margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #f8d7da;
            color: #842029;
            text-align: center;
            font-weight: 600;"
             th:text="${error}">
        </div>

        <div th:if="${success}"
             style="margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #d1e7dd;
            color: #0f5132;
            text-align: center;
            font-weight: 600;"
             th:text="${success}">
        </div>


        <form action="/admin/change-password"
              method="post">

            <div class="form-group">

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        placeholder="Enter current password"
                        required>

            </div>

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required>

            </div>

            <button type="submit"
                    class="change-password-btn">
                Change Password
            </button>

        </form>

        <a href="/admin/admissions"
           class="back-dashboard">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
